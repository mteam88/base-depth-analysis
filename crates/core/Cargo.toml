[package]
name = "base-depth-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
alloy-primitives = { version = "1.5", features = ["serde"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
futures = "0.3"
ordered-float = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.41", features = ["full"] }
