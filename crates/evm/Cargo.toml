[package]
name = "base-depth-evm"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
alloy = { version = "1.5", features = ["full"] }
alloy-primitives = "1.5"
async-trait = "0.1"
base-depth-core = { path = "../core" }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
uniswap_v3_math = "0.6"
