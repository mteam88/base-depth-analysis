<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Depth Forge | Base Liquidity</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="badge">BASE L2</span>
        <h1>Depth Forge</h1>
      </div>
      <div class="topbar-right">
        <div class="meta-strip" id="snapshot-meta"></div>
        <div class="status-pill" id="status" data-state="loading">Connecting</div>
      </div>
    </header>

    <section class="stats-bar">
      <div id="market-stats" class="stats-row"></div>
    </section>

    <section class="main-grid">
      <div class="chart-container">
        <div class="chart-header">
          <div class="chart-title-group">
            <h2>Liquidity Depth</h2>
            <span class="chart-subtitle" id="pair-label"></span>
          </div>
          <div class="chart-controls">
            <div class="legend-inline">
              <span class="leg"><span class="leg-line bid"></span>Bid</span>
              <span class="leg"><span class="leg-line ask"></span>Ask</span>
            </div>
            <div class="scale-toggle" id="scale-toggle">
              <button class="scale-btn active" data-mode="auto">Auto</button>
              <button class="scale-btn" data-mode="tight">Tight</button>
              <button class="scale-btn" data-mode="wide">Wide</button>
            </div>
          </div>
        </div>
        <div id="chart"></div>
      </div>

      <aside class="sidebar">
        <div class="sb-section">
          <div class="sb-title">Venues</div>
          <div id="venue-toggle" class="venue-grid"></div>
        </div>
        <div class="sb-section">
          <div class="sb-title">Depth Ladder</div>
          <div id="depth-table" class="depth-table"></div>
        </div>
        <div class="sb-section">
          <div class="sb-title">Pools</div>
          <div id="pool-list" class="pool-list"></div>
        </div>
      </aside>
    </section>

    <footer class="footer">
      <span>Depth Forge</span>
      <span id="snapshot-clock"></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
